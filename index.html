<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rumor Mill</title>
    <meta name="description" content="A whispering game for friends: everyone knows the secret except the Gossip. Pass private hints, hear them read aloud, catch the liar. 3 to 8 players, no login." />
    <meta name="theme-color" content="#2a1638" />
    <meta property="og:title" content="Rumor Mill" />
    <meta property="og:description" content="Everyone knows the secret except the Gossip. Whisper, listen, and catch the liar." />
    <meta property="og:image" content="assets/cover.png" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer onerror="this.remove();var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(s)"></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main id="app" aria-live="polite"><p class="boot">Listening at the door…</p></main>
    <div id="toast" role="status"></div>
    <dialog id="sheet"></dialog>
    <noscript>Rumor Mill needs JavaScript turned on.</noscript>
  </body>
</html>
